seed: 42
model:
  name: microsoft/codebert-base
  max_length: 512
  max_code_chars: 8000
  dropout: 0.1
  pooling: cls
task:
  type: detection
  num_labels: 2
  min_class_samples: 30
  top_k_classes: 28
data:
  source: merged
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  dedup: true
  min_code_chars: 30
  max_code_chars: 20000
  imbalance: weighted_loss
  max_train_samples: null
  max_eval_samples: null
  cache_dir: data/processed
training:
  output_dir: outputs
  run_name: merged_detection_codebert
  epochs: 3
  batch_size: 64
  eval_batch_size: 128
  learning_rate: 2.0e-05
  head_learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  precision: auto
  gradient_accumulation_steps: 1
  early_stopping_patience: 2
  eval_strategy: epoch
  eval_steps: 500
  save_total_limit: 2
  log_steps: 50
  num_workers: 8
  run_test_after_train: true
inference:
  checkpoint: null
  batch_size: 16
