# ============================================================================
# 代码漏洞检测 / 漏洞分类 —— BERT 微调配置文件
# ============================================================================
# 修改本文件即可调整所有训练参数，无需改代码。
#
# 参数优先级（后者覆盖前者）：
#     内置默认值(src/config.py 的 DEFAULTS)  <  本文件  <  命令行参数
# 例如：本文件写 epochs: 3，但命令行传 --epochs 5，最终生效的是 5。
#
# 每次训练结束后，实际生效的完整配置会被复制到
#     outputs/<run_name>/config.yaml
# 用于日后精确复现实验。
# ============================================================================

# 全局随机种子。固定后同样的配置能跑出同样的结果。
seed: 42

# ----------------------------------------------------------------------------
# 预训练模型
# ----------------------------------------------------------------------------
model:
  # 可选值（均可通过 scripts/download_model.py 离线下载，详见 README）：
  #   microsoft/codebert-base         代码领域 BERT，推荐首选（125M 参数）
  #   microsoft/graphcodebert-base    加入数据流图预训练，漏洞任务通常更强（125M）
  #   microsoft/unixcoder-base        多语言代码模型，支持 AST（125M）
  #   bert-base-uncased               通用英文 BERT 基线（110M）
  # 也可以直接填本地目录，例如：models/microsoft__codebert-base
  name: microsoft/codebert-base

  # 一条样本最多切成多少个 token。CodeBERT 上限 512。
  #   512 → 精度最好，但显存占用最大
  #   256 → 精度损失很小，显存减半（推荐显存 < 16GB 时使用）
  #   128 → 只适合跑通流程，正式实验不建议
  max_length: 512

  # token 级头尾截断时，头部保留的内容 token 比例。
  # max_length=512 时，扣除 [CLS]/<s> 与 [SEP]</s> 后的 510 个内容 token
  # 会按 60% / 40% 保留为前 306 个和后 204 个。
  head_ratio: 0.6

  # Dropout 比例：训练时随机丢弃 10% 的神经元，防止过拟合。
  # 数据量小可以调到 0.2~0.3；数据量大可以降到 0.05。
  dropout: 0.1

  # 池化方式：
  #   cls  → 取 [CLS] 位置的向量（BERT 专门为句子级任务训练的位置，推荐）
  #   mean → 对所有 token 求平均
  pooling: cls

# ----------------------------------------------------------------------------
# 任务设置
# ----------------------------------------------------------------------------
task:
  # detection      → 二分类：0=安全代码，1=存在漏洞
  # classification → 多分类：预测 CWE 漏洞类型（CWE-79 / CWE-89 / ...）
  type: detection

  # 类别数。detection 固定为 2；
  # classification 会自动被 data/processed/*_label_map.json 里的值覆盖。
  num_labels: 2

  # 【仅分类任务】样本量少于该值的 CWE 类别会被合并成 OTHER。
  # 长尾类别只有 1~2 条样本时，模型只会死记硬背，反而损害泛化能力。
  min_class_samples: 30

  # 【仅分类任务】最多保留多少个 CWE 类别（按样本量降序取）。
  # 设成 null 表示不限制（但类别太多会让宏 F1 很难看）。
  top_k_classes: 40

# ----------------------------------------------------------------------------
# 数据设置
# ----------------------------------------------------------------------------
data:
  # 数据源，对应 scripts/build_dataset.py 里注册的构建器：
  #   cvefixes    CVEfixes（1.9 万条检测 / 7,291 条分类，40 个 CWE）
  #               本项目只使用这一个数据源（BigVul / DiverseVul / CodeXGLUE
  #               及四源合并版已移除）。
  source: cvefixes

  # 训练 / 验证 / 测试 的划分比例。
  # 注意：是按 group_id（CVE + commit hash）分组划分，不是按单条样本随机划分。
  # 这样能避免同一漏洞的"漏洞版本"和"修复版本"分到不同集合造成数据泄漏。
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

  # 是否按代码内容的 MD5 去重。
  # CVEfixes 里有些 CVE 的 vulnerable_code 和 fixed_code 完全相同，必须去重。
  dedup: true

  # 长度过滤：短于该字符数的碎片直接丢弃（基本没有语义信息）。
  min_code_chars: 30
  # 长度截断：超过该字符数的做头尾截断（不是丢弃，是保留头尾）。
  max_code_chars: 20000

  # 类别不平衡处理策略：
  #   none              不处理（数据均衡时用）
  #   weighted_loss     加权交叉熵，按类别频率倒数给权重 ← 推荐
  #   balanced_sampler  加权随机采样，让每个 batch 类别更均衡
  #
  # 二者区别：加权损失让所有样本都参与训练、只是少数类损失被放大；
  #           平衡采样让少数类被更频繁地抽到。选一个即可，别同时用。
  imbalance: weighted_loss

  # 训练 / 评估的样本数上限，null 表示不限制。
  # 调试时设成 2000 之类的小数字，几分钟就能跑完一轮验证流程。
  max_train_samples: null
  max_eval_samples: null

  # 构建好的数据（JSONL）存放目录
  cache_dir: data/processed

# ----------------------------------------------------------------------------
# 训练设置
# ----------------------------------------------------------------------------
training:
  # 输出根目录。每次实验会在下面建一个以 run_name 命名的子目录。
  output_dir: outputs
  # 实验名。不填的话自动生成 <数据源>_<任务>_<模型名>。
  run_name: codebert_cvefixes_detection

  # 训练轮数。3 轮通常够用；再多容易过拟合。
  # 数据量很大（几十万）时可以降到 1~2 轮。
  epochs: 3

  # 一批喂多少条数据。显存不足时优先调小这个。
  # 8GB→8, 16GB→16, 24GB→32, 40GB+→64
  batch_size: 16
  # 评估时的批大小。评估不存梯度，显存占用小，可以开大一些提速。
  eval_batch_size: 32

  # 【编码器学习率】微调预训练模型的经典取值是 2e-5 ~ 5e-5。
  # 太大（如 1e-3）会把预训练权重"冲坏"，损失直接爆炸。
  learning_rate: 2.0e-5
  # 【分类头学习率】随机初始化的层需要更大步长才能快速收敛。
  # 经验值约为编码器的 5 倍。
  head_learning_rate: 1.0e-4

  # 权重衰减（L2 正则），抑制过拟合。bias 和 LayerNorm 层不做衰减。
  weight_decay: 0.01

  # 学习率预热比例：前 10% 的步数里，学习率从 0 线性升到目标值。
  # 预训练权重已经很好，一上来就用大学习率会破坏它们，所以要先"热身"。
  warmup_ratio: 0.1

  # 梯度裁剪阈值。把所有梯度的整体范数限制在该值以内，防止梯度爆炸导致 loss=NaN。
  max_grad_norm: 1.0

  # 混合精度：
  #   auto  自动选择（GPU 上优先 bf16，不支持则 fp16；CPU 上自动关闭）← 推荐
  #   fp16  半精度，速度快、显存减半，需要 GradScaler 防梯度下溢
  #   bf16  半精度但动态范围大，更稳定，需要 Ampere 及以上架构（RTX 30 系+）
  #   no    全精度 fp32，最慢但最稳
  precision: auto

  # 梯度累积步数。显存不够时的救星：
  #   batch_size=4 + gradient_accumulation_steps=4  ≡  等效 batch_size=16
  # 代价是训练变慢（每 4 个 batch 才更新一次参数）。
  gradient_accumulation_steps: 1

  # 早停：验证指标连续 N 轮不提升就停止训练，省时间也防过拟合。
  early_stopping_patience: 2

  # 评估与保存策略
  eval_strategy: epoch     # epoch = 每轮评估一次
  eval_steps: 500
  save_total_limit: 2      # 最多保留几个检查点（每个约 500MB）

  # 每多少步打印一次训练日志
  log_steps: 50

  # DataLoader 进程数。
  # Windows 下建议保持 0，否则多进程启动容易报错；
  # Linux 上可以设 4~8 加速数据读取（但本项目是动态 padding，
  # 瓶颈主要在 GPU 计算，num_workers 收益不大）。
  num_workers: 0

  # 训练结束后是否自动在测试集上评估
  run_test_after_train: true

# ----------------------------------------------------------------------------
# 推理设置
# ----------------------------------------------------------------------------
inference:
  # 检查点路径。留空则使用 outputs/<run_name>/best
  checkpoint: null
  batch_size: 16
